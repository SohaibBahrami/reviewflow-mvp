<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f1115" />
    <link rel="icon" type="image/svg+xml" href="/reviewflow-mark.svg" />
    <script>
      (() => {
        const supportedLanguages = new Set(['en', 'fr', 'es', 'el', 'pt'])
        const languagePart = document.cookie.split(';').map((part) => part.trim()).find((part) => part.startsWith('reviewflow_locale='))
        let locale = 'en'
        if (languagePart) {
          try {
            const candidate = decodeURIComponent(languagePart.slice('reviewflow_locale='.length)).toLowerCase().split(/[-_]/)[0]
            if (supportedLanguages.has(candidate)) locale = candidate
          } catch { /* Ignore an invalid preference cookie. */ }
        } else {
          const browserLanguages = navigator.languages || [navigator.language]
          for (const language of browserLanguages) {
            const candidate = String(language || '').toLowerCase().split(/[-_]/)[0]
            if (supportedLanguages.has(candidate)) { locale = candidate; break }
          }
        }
        document.documentElement.lang = locale
        let theme = 'dark'
        try {
          const saved = localStorage.getItem('reviewflow-theme')
          theme = saved === 'light' || saved === 'dark' ? saved : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
        } catch { theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark' }
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
        const themeColor = document.querySelector('meta[name="theme-color"]')
        if (themeColor) themeColor.setAttribute('content', theme === 'light' ? '#f5f6fa' : '#0f1115')
      })()
    </script>
    <style>
      html, body { margin: 0; background: #0f1115; color: #eef0f4; }
      html[data-theme='light'], html[data-theme='light'] body { background: #f5f6fa; color: #171922; }
    </style>
    <meta name="description" content="A calmer way for freelance video editors to collect client feedback and approvals." />
    <title>ReviewFlow — Client approvals without the mess</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
